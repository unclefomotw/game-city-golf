<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2433" />
    <title>City Golf</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="view">
        <canvas id="canvas"></canvas>
        <div id="toast"></div>
        <div id="win" hidden>
          <div class="card">
            <h2>完成！</h2>
            <p id="win-text"></p>
            <div class="row">
              <button type="button" id="replay">再玩這張地圖</button>
              <button type="button" id="win-new" class="primary">新地圖</button>
            </div>
          </div>
        </div>
      </div>

      <div id="panel">
        <div class="stats">
          <div><span>地圖</span><b id="seed"></b></div>
          <div><span>桿數</span><b id="strokes">0</b></div>
          <div><span>破壞分數</span><b id="score">0</b></div>
        </div>

        <section id="aim-controls">
          <div class="aim-dir">
            <div id="aim-stick" class="stick" title="左右＝轉水平方向，上下＝調仰角；推越遠轉越快"><div class="knob"></div></div>
            <div class="readout"><span>方向</span> <b id="az-val"></b></div>
            <div class="readout"><span>仰角</span> <b id="elev-val"></b></div>
          </div>
          <label class="slider power">
            <span>力道 <b id="power-val"></b></span>
            <input id="power" type="range" min="0" max="100" step="1" />
          </label>
          <div class="spin">
            <canvas id="spin-pad" title="點選擊球點：左右＝側旋，上＝上旋，下＝下旋"></canvas>
            <div class="spin-label">旋轉 <b id="spin-val"></b></div>
            <button type="button" id="spin-reset">歸零</button>
          </div>
        </section>

        <section id="free-controls" hidden>
          <div id="joystick" class="stick"><div class="knob"></div></div>
          <div class="updown">
            <button type="button" id="fly-up">上升</button>
            <button type="button" id="fly-down">下降</button>
          </div>
        </section>

        <button type="button" id="fire" class="primary">擊球</button>
        <div class="actions">
          <button type="button" id="penalty">罰桿・回上一位</button>
          <button type="button" id="ghost">靈魂出竅</button>
          <button type="button" id="new-map">新地圖</button>
        </div>
        <p id="hint"></p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
